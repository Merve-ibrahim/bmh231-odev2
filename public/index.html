<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlik Panosu</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <header>
        <p>Bozok Etkinlik</p>

        <nav>
            <a href="#liste">Etkinlikler</a>
            <a href="#oneri">Etkinlik Öner</a>
        </nav>
    </header>

    <main>
        <section id="liste">
            <h1>Yaklaşan Etkinlikler</h1>
            <p>Kampüsteki etkinlikleri burada bulabilirsiniz.</p>
            <div class="arama-filtre">
    <div>
        <label for="arama">Etkinlik ara:</label>
        <input type="search" id="arama"
               placeholder="Etkinlik adı yazınız">
    </div>

    <div class="filtreler" role="group" aria-label="Etkinlik türü">
        <button type="button" class="secili"
                data-tur="tumu" aria-pressed="true">Tümü</button>
        <button type="button"
                data-tur="atolye" aria-pressed="false">Atölye</button>
        <button type="button"
                data-tur="soylesi" aria-pressed="false">Söyleşi</button>
        <button type="button"
                data-tur="topluluk" aria-pressed="false">Topluluk</button>
    </div>
</div>

<p id="durumMesaji" role="status"></p>

<div id="etkinlikListesi" class="kartlar"></div>
        </section>

        <section id="oneri">
    <h2>Etkinlik Öner</h2>

    <form id="oneriFormu" novalidate>
        <div>
            <label for="etkinlikAdi">Etkinlik adı:</label>
            <input type="text" id="etkinlikAdi" name="baslik"
                   minlength="5" required>
        </div>

        <div>
            <label for="etkinlikTarihi">Tarih:</label>
            <input type="date" id="etkinlikTarihi" name="tarih" required>
        </div>

        <div>
            <label for="eposta">E-posta:</label>
            <input type="email" id="eposta" name="eposta" required>
        </div>

        <button type="submit">Öneriyi Gönder</button>

        <p id="formMesaji" aria-live="polite"></p>
    </form>
</section>
    </main>

    <footer>
        <p>© 2026 Bozok Etkinlik — Merve İBRAHİM</p>
    </footer>
    <script src="betik.js"></script>
</body>
</html>
